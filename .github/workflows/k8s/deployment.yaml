apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
      - name: demo-app
        image: manojkolagana25/demo-python-app:latest
        ports:
        - containerPort: 5000
